<!DOCTYPE html>
<html>
<head>
<title>Hi Thiru</title>

<style>
body{
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:linear-gradient(135deg,#111,#333);
  overflow:hidden;
  font-family:Arial, sans-serif;
}

.text{
  color:white;
  font-size:45px;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  border-right:3px solid white;
  width:0;
  animation:typing 5s steps(30,end) forwards,
            blink .7s infinite;
}

@keyframes typing{
  from{width:0;}
  to{width:100%;}
}

@keyframes blink{
  50%{border-color:transparent;}
}
</style>
</head>

<body>

<div class="text">
Hi Thiru!🤍 smile please :)
</div>
</body>
</html>
